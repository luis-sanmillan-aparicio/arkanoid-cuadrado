<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Arkanoid cuadrado</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---------- Mundo lógico: cuadrado de 1000 x 1000 ----------
const LOG = 1000;
const POR_LADO = 10;
const M = 30;                              // margen entre el borde y los ladrillos
const A = LOG - 2 * M;                     // lado útil del marco
const HB = 45;                             // grosor del ladrillo
const WB = (A - HB) / POR_LADO;            // largo del ladrillo
const ZONA = { izq: M + HB, der: M + A - HB, arriba: M + HB, abajo: M + A - HB };

const GAP = 12;                            // separación paleta-ladrillos
const PH = 22;                             // grosor de la paleta
const PL = (ZONA.der - ZONA.izq) * 0.22;   // largo de la paleta
const INSET = PH + 2 * GAP;                // margen para que las paletas no choquen en las esquinas

const CX = LOG / 2, CY = LOG / 2;          // centro
const R_PUNTO = PL / 4;                    // punto central: diámetro = media paleta
const R_BOLA = 10;
const V_BASE = 315;                        // velocidad inicial de la bola (unidades/segundo)
let V = V_BASE;                            // velocidad actual de la bola
const KMH_INICIO = 50;                     // el marcador empieza en 50 km/h
const SEG_ACELERACION = 1;                 // cada segundo...
const FACTOR_ACELERACION = Math.pow(1.2, 1 / 300); // ...x1,000608 (compuesto: +20 % cada 5 minutos)
const VIDAS_INICIO = 3;
const VIDAS_MAX = 10;
const TOQUES_PARA_VIDA = 3;                // cada 3 toques en el centro sale algo: vida, muerte, vida, muerte...
const R_CORAZON = 16;                      // radio de recogida del corazón
const FACTOR_PALETA_GRANDE = 2;            // el regalo hace crecer la paleta el doble...
const DURACION_PALETA_GRANDE = 90;         // ...durante 1 minuto y medio (segundos de juego)
const DURACION_RAYO = 0.6;

// ---------- Estado ----------
let posicion = 0.5;   // 0 = horizontales a la izquierda y laterales arriba; 1 = derecha y abajo
let vidas = VIDAS_INICIO;
let toquesCentro = 0;
let tiempo = 0;       // segundos jugados
let corazonesVida = [];  // objetos que salen del centro: { tipo: 'vida' | 'calavera', ... }
let salidas = 0;         // cuántos objetos han salido del centro
let calaveraCentro = false; // calavera cogida: espera en el centro hasta que lo toque la bola
let paletaGrande = false;   // regalo cogido: paletas al doble durante un tiempo
let tiempoPaleta = 0;       // segundos que le quedan a la paleta grande
let estado = 'inicio'; // 'inicio' | 'espera' | 'juego' | 'fin' | 'ganado'
let espera = 0;
let bx = 0, by = 0, vx = 0, vy = 0;
let rayo = null;
let ladrillos = [];

// ---------- Pantalla ----------
let W = 0, H = 0, S = 0, ox = 0, oy = 0, esc = 1;
let hud = { modo: 'arriba', x: 0, y: 0, w: 0, h: 0 }; // zona del marcador (siempre fuera del cuadrado)

function crearLadrillos() {
  const lista = [];
  for (let i = 0; i < POR_LADO; i++) {
    lista.push({ x: M + i * WB, y: M, w: WB, h: HB });
  }
  for (let i = 0; i < POR_LADO; i++) {
    lista.push({ x: M + A - HB, y: M + i * WB, w: HB, h: WB });
  }
  for (let i = 0; i < POR_LADO; i++) {
    lista.push({ x: M + A - (i + 1) * WB, y: M + A - HB, w: WB, h: HB });
  }
  for (let i = 0; i < POR_LADO; i++) {
    lista.push({ x: M, y: M + A - (i + 1) * WB, w: HB, h: WB });
  }
  lista.forEach((b, k) => {
    b.hue = (k * 360) / lista.length;
    b.vivo = true;
    b.flash = 0;
    b.muerte = 0;
  });
  return lista;
}

function ajustar() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (H >= W) {
    // Vertical: banda del marcador arriba y el cuadrado debajo
    const banda = clamp(H * 0.09, 44, 90);
    S = Math.min(W, H - banda);
    ox = (W - S) / 2;
    oy = banda + (H - banda - S) / 2;
    hud = { modo: 'arriba', x: ox, y: 0, w: S, h: oy };
  } else {
    // Horizontal: panel del marcador a la izquierda y el cuadrado a la derecha
    const panel = clamp(W * 0.16, 120, 220);
    S = Math.min(H, W - panel);
    ox = panel + (W - panel - S) / 2;
    oy = (H - S) / 2;
    hud = { modo: 'lado', x: 0, y: 0, w: ox, h: H };
  }
  esc = S / LOG;
}

// ---------- Paletas ----------
function largoPaleta() { return paletaGrande ? PL * FACTOR_PALETA_GRANDE : PL; }

function rangoH() { return { min: ZONA.izq + GAP, max: ZONA.der - GAP - largoPaleta() }; }
function rangoV() { return { min: ZONA.arriba + GAP + PH, max: ZONA.abajo - GAP - PH - largoPaleta() }; }

// Cambia el tamaño de las paletas manteniendo su centro (y el arrastre en curso) donde estaba
function cambiarPaleta(grande) {
  if (paletaGrande === grande) return;
  const rh = rangoH();
  const centro = rh.min + posicion * (rh.max - rh.min) + largoPaleta() / 2;
  paletaGrande = grande;
  const nh = rangoH();
  posicion = clamp((centro - largoPaleta() / 2 - nh.min) / (nh.max - nh.min), 0, 1);
  if (arrastrando) {
    inicioPuntero = ultimoX;
    inicioPosicion = posicion;
  }
}

function paletas() {
  const rh = rangoH();
  const rv = rangoV();
  const L = largoPaleta();
  const px = rh.min + posicion * (rh.max - rh.min);
  const py = rv.min + posicion * (rv.max - rv.min);
  return [
    { tipo: 'abajo',   x: px,                    y: ZONA.abajo - GAP - PH, w: L, h: PH },
    { tipo: 'arriba',  x: px,                    y: ZONA.arriba + GAP,     w: L, h: PH },
    { tipo: 'izq',     x: ZONA.izq + GAP,        y: py,                    w: PH, h: L },
    { tipo: 'der',     x: ZONA.der - GAP - PH,   y: py,                    w: PH, h: L }
  ];
}

// ---------- Geometría ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function circuloContraRect(cx, cy, r, rc) {
  const px = clamp(cx, rc.x, rc.x + rc.w);
  const py = clamp(cy, rc.y, rc.y + rc.h);
  const dx = cx - px, dy = cy - py;
  return { choca: dx * dx + dy * dy < r * r, dx: dx, dy: dy };
}

// Distancia a la que el rayo (origen + t*dir) entra en el rectángulo, o null
function rayoContraRect(o_x, o_y, dx, dy, rc) {
  let tmin = -Infinity, tmax = Infinity;
  if (Math.abs(dx) < 1e-9) {
    if (o_x < rc.x || o_x > rc.x + rc.w) return null;
  } else {
    const t1 = (rc.x - o_x) / dx, t2 = (rc.x + rc.w - o_x) / dx;
    tmin = Math.max(tmin, Math.min(t1, t2));
    tmax = Math.min(tmax, Math.max(t1, t2));
  }
  if (Math.abs(dy) < 1e-9) {
    if (o_y < rc.y || o_y > rc.y + rc.h) return null;
  } else {
    const t1 = (rc.y - o_y) / dy, t2 = (rc.y + rc.h - o_y) / dy;
    tmin = Math.max(tmin, Math.min(t1, t2));
    tmax = Math.min(tmax, Math.max(t1, t2));
  }
  if (tmax < Math.max(tmin, 0)) return null;
  return Math.max(tmin, 0);
}

// ---------- Juego ----------
function prepararBola() {
  bx = CX;
  by = CY + R_PUNTO + R_BOLA + 1;
  vx = 0;
  vy = 0;
  estado = 'espera';
  espera = 0.9;
}

function lanzarBola() {
  let a = (Math.random() * 2 - 1) * 0.35;
  if (Math.abs(a) < 0.1) a = a < 0 ? -0.1 : 0.1;
  vx = V * Math.sin(a);
  vy = V * Math.cos(a); // hacia abajo
  estado = 'juego';
}

function reiniciar() {
  ladrillos = crearLadrillos();
  vidas = VIDAS_INICIO;
  toquesCentro = 0;
  tiempo = 0;
  V = V_BASE;
  corazonesVida = [];
  salidas = 0;
  calaveraCentro = false;
  paletaGrande = false;
  tiempoPaleta = 0;
  rayo = null;
  prepararBola();
}

function perderVida() {
  vidas--;
  rayo = null;
  if (vidas <= 0) {
    estado = 'fin';
  } else {
    prepararBola();
  }
}

const SEMI_RAYO = (40 / 2) * Math.PI / 180; // cono de 40 grados
const LARGO_RAYO = 720; // mayor que la diagonal: se recorta en el borde del cuadrado

function dentroDelCono(px, py, a0) {
  let d = Math.atan2(py - CY, px - CX) - a0;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return Math.abs(d) <= SEMI_RAYO;
}

function conoToca(b, a0) {
  // Rayo central y bordes del cono
  const angulos = [a0, a0 - SEMI_RAYO, a0 + SEMI_RAYO];
  for (let i = 0; i < angulos.length; i++) {
    if (rayoContraRect(CX, CY, Math.cos(angulos[i]), Math.sin(angulos[i]), b) !== null) return true;
  }
  // Esquinas del ladrillo dentro del cono
  const esquinas = [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]];
  return esquinas.some((e) => dentroDelCono(e[0], e[1], a0));
}

function lanzarRayo(nx, ny, mortal) {
  // Cono que sale del centro hacia el lado contrario al golpe
  const a0 = Math.atan2(-ny, -nx);
  ladrillos.forEach((b) => {
    if (!conoToca(b, a0)) return;
    if (mortal) {
      // Con calavera: mata todos los ladrillos vivos del sector
      if (b.vivo) {
        b.vivo = false;
        b.muerte = 0.6;
      }
    } else if (!b.vivo) {
      // Sin calavera: cura los que faltan
      b.vivo = true;
      b.flash = 0.6;
    }
  });
  if (mortal && ladrillos.every((l) => !l.vivo)) estado = 'ganado';
  rayo = { a0: a0, vida: DURACION_RAYO, mortal: mortal };
}

function colisiones() {
  // 1) Tocar el cuadrado: pierdes una vida
  if (bx - R_BOLA <= 0 || bx + R_BOLA >= LOG || by - R_BOLA <= 0 || by + R_BOLA >= LOG) {
    perderVida();
    return;
  }

  // 2) Punto central: rebota y lanza el rayo
  {
    const dx = bx - CX, dy = by - CY;
    const d = Math.hypot(dx, dy);
    const lim = R_PUNTO + R_BOLA;
    if (d < lim) {
      const nx = d > 0 ? dx / d : 0;
      const ny = d > 0 ? dy / d : 1;
      const vn = vx * nx + vy * ny;
      if (vn < 0) {
        vx -= 2 * vn * nx;
        vy -= 2 * vn * ny;
        const mortal = calaveraCentro;
        calaveraCentro = false;
        lanzarRayo(nx, ny, mortal);
        toquesCentro++;
        if (toquesCentro % TOQUES_PARA_VIDA === 0) lanzarCorazon();
      }
      bx = CX + nx * (lim + 0.01);
      by = CY + ny * (lim + 0.01);
    }
  }

  // 3) Paletas
  const lista = paletas();
  for (let i = 0; i < lista.length; i++) {
    const p = lista[i];
    const c = circuloContraRect(bx, by, R_BOLA, p);
    if (!c.choca) continue;
    if (p.tipo === 'abajo' && vy > 0) {
      const a = clamp((bx - (p.x + p.w / 2)) / (p.w / 2), -1, 1) * 1.05;
      vx = V * Math.sin(a);
      vy = -V * Math.cos(a);
      by = p.y - R_BOLA - 0.01;
    } else if (p.tipo === 'arriba' && vy < 0) {
      const a = clamp((bx - (p.x + p.w / 2)) / (p.w / 2), -1, 1) * 1.05;
      vx = V * Math.sin(a);
      vy = V * Math.cos(a);
      by = p.y + p.h + R_BOLA + 0.01;
    } else if (p.tipo === 'izq' && vx < 0) {
      const a = clamp((by - (p.y + p.h / 2)) / (p.h / 2), -1, 1) * 1.05;
      vx = V * Math.cos(a);
      vy = V * Math.sin(a);
      bx = p.x + p.w + R_BOLA + 0.01;
    } else if (p.tipo === 'der' && vx > 0) {
      const a = clamp((by - (p.y + p.h / 2)) / (p.h / 2), -1, 1) * 1.05;
      vx = -V * Math.cos(a);
      vy = V * Math.sin(a);
      bx = p.x - R_BOLA - 0.01;
    }
  }

  // 4) Ladrillos: los destruye y rebota
  for (let i = 0; i < ladrillos.length; i++) {
    const b = ladrillos[i];
    if (!b.vivo) continue;
    const c = circuloContraRect(bx, by, R_BOLA, b);
    if (!c.choca) continue;
    b.vivo = false;
    if (Math.abs(c.dx) > Math.abs(c.dy)) {
      vx = Math.abs(vx) * (c.dx >= 0 ? 1 : -1);
    } else {
      vy = Math.abs(vy) * (c.dy >= 0 ? 1 : -1);
    }
    if (ladrillos.every((l) => !l.vivo)) estado = 'ganado';
    break;
  }
}

function lanzarCorazon() {
  // Sale del centro en dirección aleatoria, a la mitad de velocidad de la bola
  // Una salida cada 3 toques. Secuencia: vida, muerte, regalo, muerte, vida, muerte, regalo...
  const ciclo = ['vida', 'calavera', 'regalo', 'calavera'];
  const tipo = ciclo[salidas % ciclo.length];
  salidas++;
  const cantidad = tipo === 'calavera' ? 2 : 1; // la muerte sale doble
  for (let i = 0; i < cantidad; i++) {
    const a = Math.random() * Math.PI * 2;
    corazonesVida.push({ tipo: tipo, x: CX, y: CY, vx: Math.cos(a) * V / 2, vy: Math.sin(a) * V / 2 });
  }
}

function actualizarCorazones(dt) {
  const lista = paletas();
  for (let i = corazonesVida.length - 1; i >= 0; i--) {
    const h = corazonesVida[i];
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    // Desaparece al llegar al borde del cuadrado
    if (h.x < 0 || h.x > LOG || h.y < 0 || h.y > LOG) {
      corazonesVida.splice(i, 1);
      continue;
    }
    // Se recoge al tocar una paleta
    for (let j = 0; j < lista.length; j++) {
      if (circuloContraRect(h.x, h.y, R_CORAZON, lista[j]).choca) {
        if (h.tipo === 'calavera') {
          calaveraCentro = true;
        } else if (h.tipo === 'regalo') {
          cambiarPaleta(true);
          tiempoPaleta = DURACION_PALETA_GRANDE; // otro regalo renueva el tiempo
        } else {
          vidas = Math.min(VIDAS_MAX, vidas + 1);
        }
        corazonesVida.splice(i, 1);
        break;
      }
    }
  }
}

function actualizar(dt) {
  ladrillos.forEach((b) => {
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt);
    if (b.muerte > 0) b.muerte = Math.max(0, b.muerte - dt);
  });
  if (rayo) {
    rayo.vida -= dt;
    if (rayo.vida <= 0) rayo = null;
  }

  if (estado === 'espera') {
    espera -= dt;
    if (espera <= 0) lanzarBola();
    return;
  }
  if (estado !== 'juego') return;

  actualizarCorazones(dt);

  if (paletaGrande) {
    tiempoPaleta -= dt;
    if (tiempoPaleta <= 0) cambiarPaleta(false);
  }

  tiempo += dt;
  // Cada segundo completo la velocidad se multiplica por 1,000608
  const nuevaV = V_BASE * Math.pow(FACTOR_ACELERACION, Math.floor(tiempo / SEG_ACELERACION));
  if (nuevaV !== V) {
    const k = nuevaV / V;
    vx *= k;
    vy *= k;
    V = nuevaV;
  }

  const dist = V * dt;
  const pasos = Math.max(1, Math.ceil(dist / 4));
  const dts = dt / pasos;
  for (let i = 0; i < pasos; i++) {
    bx += vx * dts;
    by += vy * dts;
    colisiones();
    if (estado !== 'juego') break;
  }
}

// ---------- Dibujo ----------
function corazon(cx, cy, s, lleno) {
  const t = s / 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy + t * 0.9);
  ctx.bezierCurveTo(cx - t * 1.6, cy - t * 0.2, cx - t * 0.9, cy - t * 1.3, cx, cy - t * 0.45);
  ctx.bezierCurveTo(cx + t * 0.9, cy - t * 1.3, cx + t * 1.6, cy - t * 0.2, cx, cy + t * 0.9);
  ctx.closePath();
  if (lleno) {
    ctx.fillStyle = '#ff3b57';
    ctx.fill();
  } else {
    ctx.strokeStyle = '#5a2a33';
    ctx.lineWidth = Math.max(1, s * 0.08);
    ctx.stroke();
  }
}

function rectRedondo(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

// 3 huecos: 0 tiempo, 1 velocidad, 2 vidas.
// Vertical: en fila, encima del cuadrado. Horizontal: en columna, a la izquierda.
function regalo(cx, cy, s) {
  const top = cy - s * 0.35;
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(cx - s / 2, top, s, s * 0.85);                   // caja
  ctx.fillStyle = '#ff3b57';
  ctx.fillRect(cx - s * 0.09, top, s * 0.18, s * 0.85);         // cinta vertical
  ctx.fillRect(cx - s / 2, cy + s * 0.04, s, s * 0.18);         // cinta horizontal
  ctx.strokeStyle = '#ff3b57';
  ctx.lineWidth = Math.max(2, s * 0.09);
  ctx.beginPath();
  ctx.arc(cx - s * 0.15, top - s * 0.1, s * 0.15, 0, Math.PI * 2);  // lazo
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + s * 0.15, top - s * 0.1, s * 0.15, 0, Math.PI * 2);
  ctx.stroke();
}

// claro = true: calavera blanca (para fondo negro); false: calavera negra (para el punto blanco)
function calavera(cx, cy, r, claro) {
  const base = claro ? '#fff' : '#000';
  const detalle = claro ? '#000' : '#fff';
  ctx.fillStyle = base;
  // Cráneo y mandíbula
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.12, r * 0.62, 0, Math.PI * 2);
  ctx.fill();
  rectRedondo(cx - r * 0.32, cy + r * 0.2, r * 0.64, r * 0.42, r * 0.12);
  // Ojos y nariz
  ctx.fillStyle = detalle;
  ctx.beginPath();
  ctx.arc(cx - r * 0.24, cy - r * 0.15, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + r * 0.24, cy - r * 0.15, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.02);
  ctx.lineTo(cx - r * 0.08, cy + r * 0.18);
  ctx.lineTo(cx + r * 0.08, cy + r * 0.18);
  ctx.closePath();
  ctx.fill();
  // Dientes
  ctx.strokeStyle = detalle;
  ctx.lineWidth = Math.max(1, r * 0.06);
  ctx.beginPath();
  for (let k = -1; k <= 1; k++) {
    ctx.moveTo(cx + k * r * 0.14, cy + r * 0.3);
    ctx.lineTo(cx + k * r * 0.14, cy + r * 0.58);
  }
  ctx.stroke();
}

function geometriaMarcador() {
  if (hud.modo === 'arriba') {
    const sw = (hud.w * 0.94) / 3;
    const s = clamp(Math.min(hud.h * 0.45, S * 0.045), 12, 40);
    const x0 = hud.x + hud.w * 0.03;
    return {
      s: s, sw: sw, fs: Math.min(s, sw / 6.5),
      pos: (i) => ({ x: x0 + (i + 0.5) * sw, y: hud.h / 2 })
    };
  }
  const sw = hud.w * 0.9;
  const fila = Math.min(hud.h / 6, S * 0.12);
  const s = clamp(Math.min(S * 0.045, fila * 0.5), 12, 40);
  return {
    s: s, sw: sw, fs: Math.min(s, sw / 6.5),
    pos: (i) => ({ x: hud.x + hud.w / 2, y: hud.h / 2 + (i - 1) * fila })
  };
}

function dibujarVidas() {
  const g = geometriaMarcador();
  const c = g.pos(2);
  const n = Math.max(vidas, 1);
  const sp = Math.min(g.s * 1.4, g.sw / n);
  const hs = Math.min(g.s, sp / 1.15);
  for (let i = 0; i < vidas; i++) {
    corazon(c.x + (i - (vidas - 1) / 2) * sp, c.y, hs, true);
  }
}

function dibujarDatos() {
  const g = geometriaMarcador();
  const min = Math.floor(tiempo / 60);
  const seg = Math.floor(tiempo % 60);
  const textos = [
    (min < 10 ? '0' : '') + min + ':' + (seg < 10 ? '0' : '') + seg,
    Math.round(KMH_INICIO * V / V_BASE) + ' km/h'
  ];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + g.fs + 'px sans-serif';
  ctx.fillStyle = '#fff';
  for (let i = 0; i < textos.length; i++) {
    const p = g.pos(i);
    ctx.fillText(textos[i], p.x, p.y);
  }
}

function dibujarMensaje(l1, l2) {
  const tam = Math.max(16, S * 0.055);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.font = 'bold ' + tam + 'px sans-serif';
  ctx.lineWidth = tam * 0.2;
  ctx.strokeStyle = '#000';
  ctx.fillStyle = '#fff';
  const x = ox + S / 2, y = oy + S * 0.3;
  ctx.strokeText(l1, x, y);
  ctx.fillText(l1, x, y);
  ctx.font = (tam * 0.6) + 'px sans-serif';
  ctx.lineWidth = tam * 0.14;
  ctx.strokeText(l2, x, y + tam * 1.1);
  ctx.fillText(l2, x, y + tam * 1.1);
}

function dibujar() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(esc, esc);

  // Borde del cuadrado
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2 / esc;
  ctx.strokeRect(1 / esc, 1 / esc, LOG - 2 / esc, LOG - 2 / esc);

  // Ladrillos
  const g = 3;
  ladrillos.forEach((b) => {
    if (!b.vivo) {
      if (b.muerte > 0) {
        ctx.globalAlpha = Math.min(1, b.muerte / 0.6);
        ctx.fillStyle = '#ff3b57';
        ctx.fillRect(b.x + g, b.y + g, b.w - 2 * g, b.h - 2 * g);
        ctx.globalAlpha = 1;
      }
      return;
    }
    ctx.fillStyle = 'hsl(' + b.hue + ', 85%, 55%)';
    ctx.fillRect(b.x + g, b.y + g, b.w - 2 * g, b.h - 2 * g);
    if (b.flash > 0) {
      ctx.globalAlpha = Math.min(1, b.flash / 0.6);
      ctx.fillStyle = '#fff';
      ctx.fillRect(b.x + g, b.y + g, b.w - 2 * g, b.h - 2 * g);
      ctx.globalAlpha = 1;
    }
  });

  // Punto central
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(CX, CY, R_PUNTO, 0, Math.PI * 2);
  ctx.fill();

  // Calavera cogida: se queda en el centro hasta que la bola lo toque
  if (calaveraCentro) {
    ctx.strokeStyle = '#ff3b57';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(CX, CY, R_PUNTO + 3, 0, Math.PI * 2);
    ctx.stroke();
    calavera(CX, CY, R_PUNTO, false);
  }

  // Paletas
  ctx.fillStyle = '#fff';
  paletas().forEach((p) => rectRedondo(p.x, p.y, p.w, p.h, PH / 2));

  // Bola
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(bx, by, R_BOLA, 0, Math.PI * 2);
  ctx.fill();

  // Corazones de vida en vuelo
  corazonesVida.forEach((h) => {
    if (h.tipo === 'calavera') calavera(h.x, h.y, 20, true);
    else if (h.tipo === 'regalo') regalo(h.x, h.y, 32);
    else corazon(h.x, h.y, 34, true);
  });

  // Rayo curativo (atraviesa las paletas sin afectarlas)
  if (rayo) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, LOG, LOG);
    ctx.clip();
    const k = rayo.vida / DURACION_RAYO;
    const a1 = rayo.a0 - SEMI_RAYO, a2 = rayo.a0 + SEMI_RAYO;
    const grad = ctx.createRadialGradient(CX, CY, R_PUNTO, CX, CY, LARGO_RAYO);
    const c0 = rayo.mortal ? '255, 210, 210' : '220, 255, 245';
    const c1 = rayo.mortal ? '255, 40, 60' : '80, 255, 210';
    grad.addColorStop(0, 'rgba(' + c0 + ', ' + (0.85 * k) + ')');
    grad.addColorStop(1, 'rgba(' + c1 + ', ' + (0.25 * k) + ')');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, LARGO_RAYO, a1, a2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(' + c0 + ', ' + (0.9 * k) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();

  dibujarVidas();
  dibujarDatos();

  if (estado === 'inicio') dibujarMensaje('Arkanoid cuadrado', 'Toca para empezar');
  if (estado === 'fin') dibujarMensaje('Fin del juego', 'Toca para reiniciar');
  if (estado === 'ganado') dibujarMensaje('¡Has ganado!', 'Toca para reiniciar');
}

// ---------- Arrastre relativo (horizontal) ----------
let arrastrando = false;
let inicioPuntero = 0;
let inicioPosicion = 0;
let ultimoX = 0;

canvas.addEventListener('pointerdown', (e) => {
  if (estado === 'fin' || estado === 'ganado') reiniciar();
  else if (estado === 'inicio') prepararBola();
  arrastrando = true;
  inicioPuntero = e.clientX;
  ultimoX = e.clientX;
  inicioPosicion = posicion;
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});

canvas.addEventListener('pointermove', (e) => {
  if (!arrastrando) return;
  ultimoX = e.clientX;
  const rh = rangoH();
  const recorrido = (rh.max - rh.min) * esc;
  if (recorrido <= 0) return;
  posicion = clamp(inicioPosicion + (e.clientX - inicioPuntero) / recorrido, 0, 1);
  e.preventDefault();
});

function soltar() { arrastrando = false; }
canvas.addEventListener('pointerup', soltar);
canvas.addEventListener('pointercancel', soltar);

window.addEventListener('resize', ajustar);
window.addEventListener('orientationchange', () => setTimeout(ajustar, 100));

// ---------- Bucle ----------
let ultimo = 0;
function bucle(t) {
  const dt = Math.min(0.033, (t - ultimo) / 1000 || 0);
  ultimo = t;
  actualizar(dt);
  dibujar();
  requestAnimationFrame(bucle);
}

ajustar();
reiniciar();
estado = 'inicio'; // espera un toque para empezar
requestAnimationFrame(bucle);
</script>
